name: Deploy Flutter Web

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Generate Japanese holiday data
        run: >-
          python3 tool/generate_japanese_holiday_asset.py
          --output assets/data/japanese_holidays.json

      - name: Generate release metadata
        id: release_metadata
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "last_updated=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" >> "$GITHUB_OUTPUT"
          echo "title=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - run: >-
          flutter build web --release --base-href /or_app/
          --pwa-strategy=none
          --dart-define=OR_APP_NOTIFICATION_API=https://or-app-notifications.or-app-notifications.workers.dev
          --dart-define=OR_APP_RELEASE_COMMIT=${{ steps.release_metadata.outputs.commit }}
          --dart-define="OR_APP_LAST_UPDATED=${{ steps.release_metadata.outputs.last_updated }}"
          --dart-define="OR_APP_RELEASE_TITLE=${{ steps.release_metadata.outputs.title }}"

      - name: Version the Flutter application shell
        env:
          OR_APP_RELEASE: ${{ steps.release_metadata.outputs.commit }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          release = os.environ['OR_APP_RELEASE']
          index = Path('build/web/index.html')
          bootstrap = Path('build/web/flutter_bootstrap.js')
          index.write_text(
              index.read_text().replace('__OR_APP_RELEASE__', release),
              encoding='utf-8',
          )
          # Flutter's generated bootstrap owns the main entrypoint request.
          # Version only that request so new HTML and JavaScript are always a
          # matched release on GitHub Pages' short-lived static cache.
          bootstrap.write_text(
              bootstrap.read_text().replace(
                  'main.dart.js', f'main.dart.js?or_app_release={release}'
              ),
              encoding='utf-8',
          )
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build

    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
