<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="or_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>or_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Temporary startup-lifecycle diagnostic. It deliberately records only
    // document/presentation metadata and is bounded so it remains harmless.
    (function () {
      const storageKey = 'or_app.startup_diagnostic.v1';
      const bootClaimKey = 'or_app.initial_boot_presentation_claimed.v1';
      const maxEvents = 200;
      let previousRecordCostMs = null;
      const documentRunId = 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      try {
        sessionStorage.setItem('or_app.startup_diagnostic.document_run_id', documentRunId);
      } catch (_) {}

      function navigationType() {
        try {
          const entry = performance.getEntriesByType('navigation')[0];
          return entry && entry.type ? entry.type : 'unknown';
        } catch (_) {
          return 'unknown';
        }
      }

      function bootClaim() {
        try {
          return sessionStorage.getItem(bootClaimKey) === 'true' ? 'present:true' : 'absent';
        } catch (_) {
          return 'unavailable';
        }
      }

      function record(event, fields) {
        try {
          const recordStartedAt = performance.now();
          const parsed = JSON.parse(localStorage.getItem(storageKey) || '{"sequence":0,"events":[]}');
          const events = Array.isArray(parsed.events) ? parsed.events : [];
          const sequence = Number(parsed.sequence || 0) + 1;
          events.push({
            sequence: sequence,
            timestamp: new Date().toISOString(),
            documentRunId: documentRunId,
            startupRunId: null,
            layer: 'JS',
            event: event,
            fields: Object.assign({
              visibility: document.visibilityState,
              navigationType: navigationType(),
              bootSessionClaim: bootClaim(),
              diagnosticPreviousRecordCostMs: previousRecordCostMs
            }, fields || {})
          });
          if (events.length > maxEvents) events.splice(0, events.length - maxEvents);
          localStorage.setItem(storageKey, JSON.stringify({ sequence: sequence, events: events }));
          previousRecordCostMs = Math.round((performance.now() - recordStartedAt) * 10) / 10;
        } catch (_) {
          // The diagnostic never changes page startup behavior.
        }
      }

      // Exposed only for the supported custom Flutter bootstrap. Its fields
      // are compact timing metadata; no application data is inspected.
      window.__orAppStartupRecord = function (event, fields) {
        record(event, Object.assign({
          documentElapsedMs: Math.round(performance.now())
        }, fields || {}));
      };

      record('DOCUMENT_SCRIPT_START');
      record('FLUTTER_BOOTSTRAP_REQUESTED');
      document.addEventListener('DOMContentLoaded', function () { record('DOM_CONTENT_LOADED'); });
      window.addEventListener('load', function () { record('WINDOW_LOAD'); });
      window.addEventListener('pageshow', function (event) { record('PAGESHOW', { persisted: !!event.persisted }); });
      window.addEventListener('pagehide', function (event) {
        record('PAGEHIDE', { persisted: !!event.persisted });
      });
      document.addEventListener('visibilitychange', function () { record('VISIBILITY_CHANGE'); });
    })();
  </script>
  <script>
    window.__orAppStartupRecord && window.__orAppStartupRecord('FOOD_INPUT_BRIDGE_REQUESTED');
  </script>
  <script src="assets/food_input/food_input_bridge.js"
    onload="window.__orAppStartupRecord && window.__orAppStartupRecord('FOOD_INPUT_BRIDGE_SCRIPT_LOADED')"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async
    onload="window.__orAppStartupRecord && window.__orAppStartupRecord('FLUTTER_BOOTSTRAP_SCRIPT_LOADED')"></script>
</body>
</html>
