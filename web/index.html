<!DOCTYPE html>
<html>
<head>

    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!-- Let Flutter's route-wide ambient paint through the iOS standalone
       safe area instead of the WebView supplying an opaque status-bar band. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="or_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>or_app</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // In-memory startup marks: no synchronous storage write is introduced on
    // the critical path. Dart records the values in the existing diagnostics.
    window.__orAppStartupTiming = { documentStartMs: 0 };
    // Keep a tiny, bounded pre-Dart record. If WebKit suspends or terminates
    // startup before Dart runs, the next successful launch can still export
    // the last observable browser boundary. This is independent of the
    // verbose startup trace and performs only bounded scalar writes.
    (function () {
      const key = 'or_app.pre_dart_evidence.v1';
      const id = 'pre-dart-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      function read() {
        try {
          const value = JSON.parse(localStorage.getItem(key) || '{}');
          return Array.isArray(value.records) ? value.records.slice(-4) : [];
        } catch (_) { return []; }
      }
      const record = {
        recordId: id,
        startedAt: new Date().toISOString(),
        status: 'document_started',
        release: '__OR_APP_RELEASE__',
        visibility: document.visibilityState,
        navigationType: (performance.getEntriesByType('navigation')[0] || {}).type || 'unknown'
      };
      function write() {
        try {
          const records = read().filter(function (item) { return item.recordId !== id; });
          records.push(record);
          localStorage.setItem(key, JSON.stringify({ schemaVersion: 1, records: records.slice(-5) }));
        } catch (_) {}
      }
      window.__orAppMarkPreDart = function (event, fields) {
        record.status = event;
        record.lastMarkMs = performance.now();
        if (fields) Object.assign(record, fields);
        queueMicrotask(write);
      };
      queueMicrotask(write);
    })();
  </script>
  <style>
    /* Keep the document surface continuous with Flutter's Boot canvas. */
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #101010;
      color: #f4fafc;
    }
    flutter-view, flt-glass-pane, flt-scene-host {
      background: #101010;
    }
  </style>
</head>
<body>
  <script>
    // Temporary startup-lifecycle diagnostic. It deliberately records only
    // document/presentation metadata and is bounded so it remains harmless.
    (function () {
      const storageKey = 'or_app.startup_diagnostic.v1';
      const bootClaimKey = 'or_app.initial_boot_presentation_claimed.v1';
      const maxEvents = 200;
      // Controlled startup-performance A/B: preserve document identity, but
      // avoid synchronous full-trace localStorage mutations before Dart main.
      const persistPreDartTrace = false;
      const documentRunId = 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      try {
        sessionStorage.setItem('or_app.startup_diagnostic.document_run_id', documentRunId);
      } catch (_) {}

      function navigationType() {
        try {
          const entry = performance.getEntriesByType('navigation')[0];
          return entry && entry.type ? entry.type : 'unknown';
        } catch (_) {
          return 'unknown';
        }
      }

      function bootClaim() {
        try {
          return sessionStorage.getItem(bootClaimKey) === 'true' ? 'present:true' : 'absent';
        } catch (_) {
          return 'unavailable';
        }
      }

      function record(event, fields) {
        if (!persistPreDartTrace) return;
        try {
          const parsed = JSON.parse(localStorage.getItem(storageKey) || '{"sequence":0,"events":[]}');
          const events = Array.isArray(parsed.events) ? parsed.events : [];
          const sequence = Number(parsed.sequence || 0) + 1;
          events.push({
            sequence: sequence,
            timestamp: new Date().toISOString(),
            documentRunId: documentRunId,
            startupRunId: null,
            layer: 'JS',
            event: event,
            fields: Object.assign({
              visibility: document.visibilityState,
              navigationType: navigationType(),
              bootSessionClaim: bootClaim()
            }, fields || {})
          });
          if (events.length > maxEvents) events.splice(0, events.length - maxEvents);
          localStorage.setItem(storageKey, JSON.stringify({ sequence: sequence, events: events }));
        } catch (_) {
          // The diagnostic never changes page startup behavior.
        }
      }

      record('DOCUMENT_SCRIPT_START');
      record('FLUTTER_BOOTSTRAP_REQUESTED');
      document.addEventListener('DOMContentLoaded', function () { record('DOM_CONTENT_LOADED'); });
      window.addEventListener('load', function () { record('WINDOW_LOAD'); });
      window.addEventListener('pageshow', function (event) { record('PAGESHOW', { persisted: !!event.persisted }); });
      window.addEventListener('pagehide', function (event) {
        record('PAGEHIDE', { persisted: !!event.persisted });
      });
      document.addEventListener('visibilitychange', function () { record('VISIBILITY_CHANGE'); });
    })();
  </script>
  <script src="assets/food_input/food_input_bridge.js"></script>
  <script src="or_app_push_bridge.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Flutter web builds from before the current non-PWA deployment could
    // leave a scoped Flutter service worker alive.  That worker may return an
    // old application shell together with a newer bundle after a deployment.
    // Retire only identifiable legacy Flutter workers. The notification
    // worker intentionally shares the application scope, so scope alone is
    // never sufficient evidence for unregistering a worker.
    window.__orAppStartupRecovery = (async function () {
      if (!('serviceWorker' in navigator)) return;
      const basePath = new URL(document.baseURI).pathname;
      const reloadKey = 'or_app.legacy_service_worker_retired.v1';
      const workerScripts = function (registration) {
        return [registration.active, registration.waiting, registration.installing]
          .filter(Boolean)
          .map(function (worker) {
            try {
              return new URL(worker.scriptURL, document.baseURI).pathname;
            } catch (_) {
              return null;
            }
          });
      };
      const scriptNameIs = function (pathname, name) {
        return typeof pathname === 'string' && pathname.endsWith('/' + name);
      };
      const isLegacyFlutterRegistration = function (registration) {
        let inApplicationScope = false;
        try {
          inApplicationScope = new URL(registration.scope).pathname.indexOf(basePath) === 0;
        } catch (_) {
          return false;
        }
        if (!inApplicationScope) return false;
        const scripts = workerScripts(registration);
        if (scripts.length === 0 || scripts.some(function (script) { return script === null; })) {
          return false;
        }
        if (scripts.some(function (script) {
          return scriptNameIs(script, 'or_app_push_sw.js');
        })) {
          return false;
        }
        return scripts.every(function (script) {
          return scriptNameIs(script, 'flutter_service_worker.js');
        });
      };
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const legacyFlutterRegistrations = registrations.filter(isLegacyFlutterRegistration);
        const results = await Promise.all(legacyFlutterRegistrations.map(function (registration) {
          return registration.unregister();
        }));
        const retired = results.some(Boolean);
        const attempts = Number(sessionStorage.getItem(reloadKey) || '0');
        // A reload detaches this document from the now-unregistered legacy
        // worker.  Bound it to two attempts so a browser implementation that
        // retains a controller cannot create a reload loop.
        if (retired && attempts < 2) {
          sessionStorage.setItem(reloadKey, String(attempts + 1));
          window.location.replace(window.location.href);
          return new Promise(function () {});
        }
        sessionStorage.removeItem(reloadKey);
      } catch (_) {
        // Service worker migration is best effort.  Bootstrap still proceeds
        // if browser storage is disabled or unavailable.
      }
    })();
  </script>
  <script>
    // The release token is substituted in the Pages workflow.  It prevents a
    // newly fetched HTML shell from pairing with a max-age cached bootstrap.
    // The bootstrap itself is patched by the workflow to request the matching
    // main.dart.js release token as well.
    window.__orAppStartupRecovery.finally(function () {
      window.__orAppStartupTiming.bootstrapRequestedMs = performance.now();
      window.__orAppMarkPreDart('bootstrap_requested', {
        bootstrapRequestedMs: window.__orAppStartupTiming.bootstrapRequestedMs
      });
      // Begin acquiring the release-matched Dart bundle while the generated
      // Flutter bootstrap initializes the engine. This runs only after legacy
      // service-worker recovery, so an obsolete worker cannot satisfy it.
      const mainPreload = document.createElement('link');
      mainPreload.rel = 'preload';
      mainPreload.as = 'script';
      mainPreload.fetchPriority = 'high';
      mainPreload.href = 'main.dart.js?or_app_release=__OR_APP_RELEASE__';
      window.__orAppStartupTiming.mainPreloadRequestedMs = performance.now();
      mainPreload.addEventListener('load', function () {
        window.__orAppStartupTiming.mainPreloadLoadedMs = performance.now();
        window.__orAppMarkPreDart('main_preload_loaded', {
          mainPreloadLoadedMs: window.__orAppStartupTiming.mainPreloadLoadedMs
        });
      }, { once: true });
      mainPreload.addEventListener('error', function () {
        window.__orAppMarkPreDart('main_preload_failed', {});
      }, { once: true });
      document.head.appendChild(mainPreload);
      const bootstrap = document.createElement('script');
      bootstrap.async = true;
      bootstrap.src = 'flutter_bootstrap.js?or_app_release=__OR_APP_RELEASE__';
      bootstrap.addEventListener('load', function () {
        window.__orAppStartupTiming.bootstrapScriptLoadedMs = performance.now();
        window.__orAppMarkPreDart('bootstrap_loaded', {
          bootstrapScriptLoadedMs: window.__orAppStartupTiming.bootstrapScriptLoadedMs
        });
      }, { once: true });
      document.body.appendChild(bootstrap);
    });
  </script>
</body>
</html>
